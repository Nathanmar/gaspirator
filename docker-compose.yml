name: gaspirator

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.vite
      args:
        VITE_SERVER_URL: http://localhost:8000
    env_file:
      - apps/web/.env
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: apps/server
      dockerfile: Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGIN=http://localhost:3001
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gaspirator}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gaspirator}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+: mount the parent dir (PGDATA is /var/lib/postgresql/18/docker)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
