name: gaspirator

services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: apps/web/Dockerfile.vite
      target: dev
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:8000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - .:/app
      # Linux node_modules kept in the container, so they never mix with the host's macOS ones.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/env/node_modules
      - /app/packages/config/node_modules
    env_file:
      - apps/web/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    container_name: backend
    build:
      context: apps/server
      dockerfile: Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Prism validation proxy: same API as `app`, checked against openapi.yaml.
  # Paths without the /api/v1 prefix (e.g. POST http://localhost:4010/auth/login);
  # contract violations are reported in the `sl-violations` response header.
  prism:
    container_name: prism
    image: stoplight/prism:5.15.10
    command: proxy -h 0.0.0.0 --multiprocess false /contract/openapi.yaml http://backend:8000/api/v1
    volumes:
      - ./openapi.yaml:/contract/openapi.yaml:ro
    ports:
      - "4010:4010"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    container_name: db
    image: postgres:18-alpine
    env_file:
      - apps/server/.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    restart: unless-stopped

volumes:
  db-data:
