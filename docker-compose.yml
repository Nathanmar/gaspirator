name: gaspirator

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.vite
      args:
        VITE_SERVER_URL: http://localhost:8000
    env_file:
      - apps/web/.env
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: apps/server
      dockerfile: Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGIN=http://localhost:3001
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
