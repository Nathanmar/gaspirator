name: gaspirator

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.vite
      args:
        VITE_SERVER_URL: http://localhost:8000
        VITE_API_URL: http://localhost:8000/api/v1
    env_file:
      - apps/web/.env
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: apps/server
      dockerfile: Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGIN=http://localhost:3001
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gaspirator}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Prism validation proxy: same API as `app`, checked against openapi.yaml.
  # Paths without the /api/v1 prefix (e.g. POST http://localhost:4010/auth/login);
  # contract violations are reported in the `sl-violations` response header.
  prism:
    image: stoplight/prism:5.15.10
    # --multiprocess false: the image crashes in cluster mode (reading 'isPrimary').
    command: proxy -h 0.0.0.0 --multiprocess false /contract/openapi.yaml http://app:8000/api/v1
    volumes:
      - ./openapi.yaml:/contract/openapi.yaml:ro
    ports:
      - "4010:4010"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gaspirator}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+: mount the parent dir (PGDATA is /var/lib/postgresql/18/docker)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Mailpit: fake SMTP server for development. It catches every e-mail sent by the API
  # (never delivered to real addresses) and shows them on http://localhost:8025.
  # From the `app` container the SMTP server is mailpit:1025, from the host localhost:1025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    restart: unless-stopped

volumes:
  db-data:
