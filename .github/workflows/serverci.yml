name: Server CI

# Template called by ci.yml when apps/server or openapi.yaml change.
on:
  workflow_call:
    inputs:
      strict:
        description: Release mode, CVE audit fails on any finding
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  server:
    name: Server lint & tests (Python)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/server
    services:
      # Same image as the `db` service of docker-compose.yml.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaspirator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaspirator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gaspirator_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      # Node.js runs the Prism validation proxy (npx @stoplight/prism-cli) in the tests.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Migrations up to date
        run: uv run --frozen alembic upgrade head && uv run --frozen alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      - name: Pytest
        run: uv run --frozen pytest

  audit-python:
    name: CVE audit (server / Python)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
      # Report only on develop; on release (strict) any finding fails (pip-audit has no severity filter).
      - name: pip-audit
        continue-on-error: ${{ !inputs.strict }}
        run: uvx pip-audit -r requirements.txt --no-deps --disable-pip
