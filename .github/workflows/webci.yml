name: Web CI

# Template called by ci.yml when apps/web, apps/mobile or the JS workspace change.
on:
  workflow_call:
    inputs:
      skipBiome:
        description: Skip the Biome check on files changed since origin/develop (release PRs)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Biome --changed compares with origin/develop

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        if: ${{ !inputs.skipBiome }}
        run: pnpm exec biome ci --changed --since=origin/develop --no-errors-on-unmatched

      - name: Type check
        run: pnpm run check-types

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  audit-web:
    name: CVE audit (web / TanStack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # High/critical always fail. Ignore a CVE via auditConfig.ignoreGhsas in pnpm-workspace.yaml.
      - name: pnpm audit
        run: pnpm audit --audit-level high
