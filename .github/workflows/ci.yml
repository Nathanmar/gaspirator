name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  # Detects which parts changed, so each template below only runs when needed.
  # A skipped job counts as passed, so required checks never block a PR.
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflows: &workflows
              - .github/workflows/**
            web:
              - *workflows
              - openapi.yaml
              - apps/web/**
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - biome.json
            mobile:
              - *workflows
              - openapi.yaml
              - apps/mobile/**
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - biome.json
            server:
              - *workflows
              - openapi.yaml
              - apps/server/**

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/webci.yml

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/serverci.yml

  image-web:
    name: Image web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/imageci.yml
    with:
      name: web
      context: .
      dockerfile: apps/web/Dockerfile.vite

  image-server:
    name: Image server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/imageci.yml
    with:
      name: server
      context: apps/server
      dockerfile: apps/server/Dockerfile

  codeql-js:
    name: CodeQL JS/TS
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      language: javascript-typescript

  codeql-python:
    name: CodeQL Python
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      language: python

  codeql-actions:
    name: CodeQL Actions
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
    with:
      language: actions

  # Cheap and covers every manifest, so it always runs on PRs.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Report only for now, like the other CVE checks.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
