name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Build
        run: pnpm run build

  server:
    name: Server lint & tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      # Same image as the `db` service of docker-compose.yml.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaspirator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaspirator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gaspirator_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Node.js runs the Prism validation proxy (npx @stoplight/prism-cli) in the tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Migrations up to date
        run: uv run --frozen alembic upgrade head && uv run --frozen alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      - name: Pytest
        run: uv run --frozen pytest

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report only for now, like the other CVE checks.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true

  audit-web:
    name: CVE audit (web / TanStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Report only for now: findings never fail the pipeline, whatever the severity.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit

  audit-python:
    name: CVE audit (server / Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
      # Report only for now: findings never fail the pipeline, whatever the severity.
      - name: pip-audit
        continue-on-error: true
        run: uvx pip-audit -r requirements.txt --no-deps --disable-pip

  image:
    name: Build & scan image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile.vite
          - name: server
            context: apps/server
            dockerfile: apps/server/Dockerfile
    env:
      IMAGE_TAR: /tmp/gaspirator-${{ matrix.name }}.tar
      REPORT: /tmp/trivy-${{ matrix.name }}.txt
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: gaspirator-${{ matrix.name }}:${{ github.sha }}
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.76.2
          input: ${{ env.IMAGE_TAR }}
          format: table
          output: ${{ env.REPORT }}
          exit-code: "0"

      - name: Add report to job summary
        run: |
          {
            echo "### Trivy report: ${{ matrix.name }}"
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

