info:
  name: Search suppliers
  type: http
  seq: 1
http:
  method: GET
  url: "{{BASE_URL_SUPPLIERS}}?radius_km=10&page=1&per_page=20"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data.length) bru.setVar("SUPPLIER_ID", res.body.data[0].id);
