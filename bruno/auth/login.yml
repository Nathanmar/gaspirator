info:
  name: Login
  type: http
  seq: 1
http:
  method: POST
  url: "{{BASE_URL_AUTH}}/login"
  body:
    type: json
    data: |-
      {
        "email": "{{USER_EMAIL}}",
        "password": "{{USER_PASSWORD}}"
      }
  auth:
    type: none
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("USER_TOKEN", res.body.access_token);
          bru.setVar("USER_REFRESH_TOKEN", res.body.refresh_token);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
