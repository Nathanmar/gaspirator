info:
  name: Refresh
  type: http
  seq: 3
http:
  method: POST
  url: "{{BASE_URL_AUTH}}/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{USER_REFRESH_TOKEN}}"
      }
  auth:
    type: none
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("USER_TOKEN", res.body.access_token);
          bru.setVar("USER_REFRESH_TOKEN", res.body.refresh_token);
        }
