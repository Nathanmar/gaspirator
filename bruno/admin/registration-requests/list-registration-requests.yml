info:
  name: List pending registration requests
  type: http
  seq: 1
http:
  method: GET
  url: "{{BASE_ADMIN_URL_REGISTRATION}}?page=1&per_page=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data.length) bru.setVar("REQUEST_ID", res.body.data[0].id);
