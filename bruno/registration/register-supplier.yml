      {
        "supplier": {
          "name": "Cantine du lycée Ampère",
          "legal_id": "19690103400017",
          "supplier_type": "canteen",
          "contact_phone": "04 78 00 00 00"
        },
        "account": {
          "firstname": "Marie",
          "lastname": "Dupont",
          "email": "marie.dupont@example.org",
